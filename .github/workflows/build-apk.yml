name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Generate platform scaffolding
        run: flutter create --platforms android --org com.arturklimcue --project-name kodik .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Generate signing keystore
        run: |
          keytool -genkey -v \
            -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass kodikrelease2026 \
            -alias kodik \
            -keypass kodikrelease2026 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Kodik, OU=Mobile, O=ArturKlimcue, L=Moscow, C=RU"
          cp "$RUNNER_TEMP/upload.jks" android/app/upload.jks
          cat > android/key.properties <<EOF
          storePassword=kodikrelease2026
          keyPassword=kodikrelease2026
          keyAlias=kodik
          storeFile=upload.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kodik-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "КодиК APK v1.0.${{ github.run_number }}"
          files: build/app/outputs/flutter-apk/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}